[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insurance-policy-generation-chatbot"
version = "0.1.0"
description = "RAG assistant for insurance policy search, grounded Q&A and policy generation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.140.13",
  "langchain>=1.2,<2",
  "langchain-openai>=1.1,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "openai>=2.50.0",
  "pandas>=2.2,<3",
  "pypdf>=5,<7",
  "python-dotenv>=1.0,<2",
  "qdrant-client>=1.18.0",
  "scikit-learn>=1.5,<2",
  "uvicorn>=0.51.0",
]

[project.optional-dependencies]
dev = [
  "chainlit>=2.11,<3",
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
insurance-eda = "insurance_chatbot.eda:main"
insurance-index = "insurance_chatbot.indexing:main"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_chatbot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
